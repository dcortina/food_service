packages:
  - apps/*
  - libs/*
  - packages/*

minimumReleaseAge: 0

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  better-sqlite3: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@angular/common@22.2.4'
  - '@angular/compiler-cli@22.2.4'
  - '@angular/compiler@22.2.4'
  - '@angular/core@22.2.4'
  - '@angular/forms@22.2.4'
  - '@angular/language-service@22.2.4'
  - '@angular/platform-browser-dynamic@22.2.4'
  - '@angular/platform-browser@22.2.4'
  - '@angular/router@22.2.4'

onlyBuiltDependencies:
  - nx
  - '@nx/nx-linux-x64-gnu'
  - '@prisma/engines'
  - prisma
  - esbuild
  - argon2
