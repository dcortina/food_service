<div class="min-h-screen bg-charcoal bg-dots text-cream">
  <header class="border-b border-white/10 bg-charcoal/95 backdrop-blur">
    <div
      class="mx-auto flex h-16 max-w-[1800px] items-center gap-3 px-4 sm:px-6"
    >
      <app-brand-mark
        [name]="branding.name()"
        [logoUrl]="branding.logoUrl()"
        size="md"
      />
      <div class="min-w-0">
        <p class="truncate text-sm font-extrabold tracking-tight text-white">
          {{ branding.name() }}
        </p>
        <p class="text-[11px] uppercase tracking-[0.16em] text-mustard-300">
          Cocina
        </p>
      </div>

      <div class="ml-auto flex items-center gap-3">
        <span
          [class]="
            realtime.connected()
              ? 'inline-flex items-center gap-1.5 rounded-full bg-lettuce/10 px-2.5 py-1 text-[11px] font-bold text-lettuce'
              : 'inline-flex items-center gap-1.5 rounded-full bg-brand-500/15 px-2.5 py-1 text-[11px] font-bold text-brand-300'
          "
        >
          <span
            [class]="
              realtime.connected()
                ? 'h-1.5 w-1.5 rounded-full bg-lettuce'
                : 'h-1.5 w-1.5 rounded-full bg-brand-400'
            "
          ></span>
          {{ realtime.connected() ? 'En vivo' : 'Reconectando' }}
        </span>

        <span class="hidden text-sm font-bold tabular-nums text-stone-300 sm:block">
          {{ clock() }}
        </span>

        <div class="hidden text-right sm:block">
          <p class="text-sm font-semibold text-white">{{ user()?.nombre }}</p>
          <p class="text-xs text-stone-400">{{ roleLabel() }}</p>
        </div>
        <div
          class="grid h-9 w-9 place-items-center rounded-full bg-mustard-400 text-xs font-black text-charcoal sm:hidden"
        >
          {{ initials() }}
        </div>
        <button
          type="button"
          (click)="logout()"
          class="rounded-xl border border-white/10 px-3 py-2 text-xs font-bold text-stone-300 transition hover:border-brand-300/40 hover:bg-white/5 hover:text-white"
        >
          Salir
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-[1800px] p-4 sm:p-6">
    <router-outlet />
  </main>
</div>
