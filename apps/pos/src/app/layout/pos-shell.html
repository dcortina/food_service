<div class="min-h-screen bg-cream bg-dots">
  <header class="bg-charcoal text-white">
    <div
      class="mx-auto flex h-16 max-w-[1600px] items-center gap-3 px-4 sm:px-6"
    >
      <app-brand-mark
        [name]="branding.name()"
        [logoUrl]="branding.logoUrl()"
        size="md"
      />
      <div class="min-w-0">
        <p class="truncate text-sm font-extrabold tracking-tight text-white">
          {{ branding.name() }}
        </p>
        <p class="text-[11px] uppercase tracking-[0.16em] text-mustard-300">
          Punto de venta
        </p>
      </div>

      <div class="ml-auto flex items-center gap-3">
        <span
          class="hidden rounded-full bg-white/5 px-3 py-1.5 text-xs font-semibold text-stone-300 md:inline-flex"
        >
          {{ user()?.sucursal?.nombre || 'Sucursal principal' }}
        </span>
        <div class="hidden text-right sm:block">
          <p class="text-sm font-semibold text-white">{{ user()?.nombre }}</p>
          <p class="text-xs text-stone-400">{{ roleLabel() }}</p>
        </div>
        <div
          class="grid h-9 w-9 place-items-center rounded-full bg-brand-600 text-xs font-black text-white sm:hidden"
        >
          {{ initials() }}
        </div>
        <button
          type="button"
          (click)="logout()"
          class="rounded-xl border border-white/10 px-3 py-2 text-xs font-bold text-stone-300 transition hover:border-brand-300/40 hover:bg-white/5 hover:text-white"
        >
          Salir
        </button>
      </div>
    </div>

    <nav class="border-t border-white/5">
      <div
        class="mx-auto flex max-w-[1600px] gap-1 overflow-x-auto px-4 sm:px-6"
      >
        @for (item of nav(); track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="pos-tab-active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            class="pos-tab flex items-center gap-2 whitespace-nowrap rounded-t-xl px-4 py-3 text-sm font-bold"
          >
            <svg
              class="h-4 w-4 shrink-0 opacity-80"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path [attr.d]="item.icon" />
            </svg>
            {{ item.label }}
          </a>
        }
      </div>
    </nav>
  </header>

  <main class="mx-auto w-full max-w-[1600px] p-4 sm:p-6">
    <router-outlet />
  </main>
</div>
