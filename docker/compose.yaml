name: cafeqr

services:
  postgres:
    image: postgres:16-alpine
    container_name: cafeqr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafeqr
      POSTGRES_PASSWORD: cafeqr
      POSTGRES_DB: cafeqr
    ports:
      - '5434:5432'
    volumes:
      - cafeqr-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cafeqr -d cafeqr']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cafeqr-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - cafeqr-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cafeqr-postgres:
  cafeqr-redis:
